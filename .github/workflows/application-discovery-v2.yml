name: Application Discovery v2

run-name: Application discovery v2 - ${{ inputs.storyKey }} - ${{ inputs.discoveryId }}

on:
  workflow_dispatch:
    inputs:
      storyKey:
        description: Jira story key
        required: true
        type: string

      executionId:
        description: QA AI Copilot execution ID
        required: true
        type: string

      discoveryId:
        description: Application discovery ID
        required: true
        type: string

      applicationName:
        description: Application name
        required: true
        type: string

      targetUrl:
        description: URL to inspect
        required: true
        default: http://localhost:4200
        type: string

      discoveryScope:
        description: Discovery scope
        required: true
        default: SINGLE_PAGE
        type: string

      branch:
        description: Repository branch
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  validate-discovery-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA AI Copilot repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Checkout Practice Software Testing
        uses: actions/checkout@v5
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Start Practice Software Testing
        working-directory: practice-software-testing
        shell: bash
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up --pull missing -d

      - name: Show Practice Software Testing services
        working-directory: practice-software-testing
        shell: bash
        run: |
          echo "===== Docker Compose Services ====="

          docker compose \
            -f docker-compose.prod.yml \
            ps

          echo ""
          echo "===== Container Logs ====="

          docker compose \
            -f docker-compose.prod.yml \
            logs --tail=100

      - name: Wait for Practice Software Testing UI
        shell: bash
        run: |
          echo "Waiting for UI at http://localhost:4200"

          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              http://localhost:4200 > /dev/null; then
              echo "Practice Software Testing UI is ready."
              exit 0
            fi

            echo "Attempt ${attempt}/60: UI is not ready yet."
            sleep 5
          done

          echo "UI did not become ready in time."

          docker compose \
            -f practice-software-testing/docker-compose.prod.yml \
            ps

          docker compose \
            -f practice-software-testing/docker-compose.prod.yml \
            logs --tail=200

          exit 1

      - name: Create validation workspace
        shell: bash
        run: |
          mkdir -p application-discovery-v2

      - name: Create discovery package
        working-directory: application-discovery-v2
        shell: bash
        run: |
          npm init -y
          npm install playwright@1.55.0

      - name: Install Chromium
        working-directory: application-discovery-v2
        shell: bash
        run: |
          npx playwright install --with-deps chromium

      - name: Execute standalone discovery script
        working-directory: application-discovery-v2
        shell: bash
        env:
          STORY_KEY: ${{ inputs.storyKey }}
          EXECUTION_ID: ${{ inputs.executionId }}
          DISCOVERY_ID: ${{ inputs.discoveryId }}
          APPLICATION_NAME: ${{ inputs.applicationName }}
          TARGET_URL: ${{ inputs.targetUrl }}
          DISCOVERY_SCOPE: ${{ inputs.discoveryScope }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cp ../tools/discovery/discover-application.js .
          node discover-application.js

      - name: Create discovery metadata
        if: always()
        working-directory: application-discovery-v2
        shell: bash
        run: |
          cat > discovery-metadata.json <<EOF
          {
            "storyKey": "${{ inputs.storyKey }}",
            "executionId": "${{ inputs.executionId }}",
            "discoveryId": "${{ inputs.discoveryId }}",
            "applicationName": "${{ inputs.applicationName }}",
            "targetUrl": "${{ inputs.targetUrl }}",
            "discoveryScope": "${{ inputs.discoveryScope }}",
            "branch": "${{ inputs.branch }}",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunAttempt": "${{ github.run_attempt }}",
            "commitSha": "${{ github.sha }}",
            "completedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Prepare discovery knowledge for repository
        shell: bash
        run: |
          TARGET_DIR="executions/${{ inputs.storyKey }}/discovery/${{ inputs.discoveryId }}"

          mkdir -p "$TARGET_DIR"

          cp application-discovery-v2/application-discovery.json \
            "$TARGET_DIR/application-discovery.json"

          cp application-discovery-v2/selector-library.json \
            "$TARGET_DIR/selector-library.json"

          cp application-discovery-v2/discovery-metadata.json \
            "$TARGET_DIR/discovery-metadata.json"

          echo ""
          echo "Prepared discovery knowledge:"
          ls -la "$TARGET_DIR"

          echo ""
          echo "Files:"
          find "$TARGET_DIR" -maxdepth 1 -type f | sort

      - name: Commit discovery knowledge
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: |
            Store discovery knowledge for ${{ inputs.storyKey }}

          file_pattern: |
            executions/${{ inputs.storyKey }}/discovery/${{ inputs.discoveryId }}/*.json

      - name: Show discovery output
        working-directory: application-discovery-v2
        shell: bash
        run: |
          cat application-discovery.json

      - name: Upload discovery artifacts
        uses: actions/upload-artifact@v6
        with:
          name: application-discovery-v2-${{ inputs.storyKey }}-${{ inputs.discoveryId }}
          path: |
            application-discovery-v2/application-discovery.json
            application-discovery-v2/selector-library.json
            application-discovery-v2/discovery-metadata.json
            application-discovery-v2/homepage.png
          if-no-files-found: error
          retention-days: 7
